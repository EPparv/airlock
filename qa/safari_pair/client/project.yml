name: SafariPairProbe
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Probe:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.airlock.qa.pairprobe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SafariPairTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Probe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.airlock.qa.safaripairtests
        TEST_TARGET_NAME: Probe
schemes:
  PairAcceptance:
    build:
      targets:
        Probe: all
        SafariPairTests: [test]
    test:
      targets: [SafariPairTests]
      gatherCoverageData: false
