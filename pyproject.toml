[project]
name = "airlock-privacy"
version = "0.11.0"
description = "Local privacy control panel and personal context for MCP agents"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'", "cryptography==50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'", "pyyaml==6.0.3", "sigstore==4.5.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

