<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer">
<title>Airlock · Workspace</title><link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/workspace.css"><script defer src="/workspace.js"></script>
</head><body>
<header class="top"><div class="wordmark"><span class="mark" aria-hidden="true"><i></i></span>Airlock</div>
<div class="workspace-switch"><span id="mode" class="mode">Workspace</span><button id="switch" class="quiet" hidden></button></div></header>
<div class="layout"><aside><nav aria-label="Workspace">
<button class="nav active" data-tab="actions"><span class="glyph" aria-hidden="true">▣</span>Actions<span id="pending-count" class="count" hidden></span></button>
<button class="nav" data-tab="agents"><span class="glyph" aria-hidden="true">⌘</span>Agents</button>
<button class="nav" data-tab="library"><span class="glyph" aria-hidden="true">▤</span>Library</button>
<button class="nav" data-tab="activity"><span class="glyph" aria-hidden="true">↺</span>Activity</button>
</nav><div class="aside-bottom"><span class="local-dot"></span>On this device<a id="advanced" href="/">Privacy checks ↗</a></div></aside>
<main><div id="notice" role="status" aria-live="polite" hidden></div><div class="title-row"><div><h1 id="title">Private actions</h1><p id="subtitle">Loading your workspace…</p></div><button id="primary" class="button" hidden></button></div><section id="content" aria-label="Workspace items" aria-busy="true"></section></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" class="icon" aria-label="Close dialog">×</button></div><div id="dialog-content"></div><p id="dialog-error" role="alert" hidden></p></dialog>
</body></html>
