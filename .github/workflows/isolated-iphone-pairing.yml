name: iPhone and Mac release pairing regression
on:
  push:
    branches: ['test/iphone-mac-pairing-308cfe1e73']
    paths: ['.github/workflows/isolated-iphone-pairing.yml']
permissions:
  contents: read
jobs:
  pairing:
    name: Pair released iPhone WebKit with the Mac gateway
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --only-binary=:all: -r requirements.lock
      - run: python scripts/smoke_iphone.py
