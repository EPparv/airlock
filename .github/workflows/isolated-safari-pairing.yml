name: Verify Airlock in Mobile Safari
on:
  push:
    branches: ['test/iphone-mac-pairing-308cfe1e73']
    paths: ['.github/workflows/isolated-safari-pairing.yml','qa/safari_pair/**']
permissions:
  contents: read
jobs:
  safari:
    name: Pair Apple Mobile Safari with the Airlock Mac service
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Prepare the iOS UI test tools
        run: |
          if [[ -d /Applications/Xcode_16.4.app ]]; then sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer; fi
          command -v xcodegen || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Pair, read, queue an approval and disconnect using Safari.app
        run: python -u qa/safari_pair/acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-safari-pairing-receipt
          path: pairing-result.json
          retention-days: 7
          if-no-files-found: error
