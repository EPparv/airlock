name: Validate and publish Airlock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airlock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Install pinned NEAR SDK for encryption and setup checks
        run: python -m pip install -r requirements-near.txt
      - name: Check updated browser scripts
        run: |
          for script in ui/workspace*.js scripts/workspace_preview_adapter.js; do node --check "$script"; done
          node --check privacy_layer/device_apps.js
          node --check ui/safe-test.js
          node --check ui/ui.js
          node --check ui/onboarding.js
          node --check ui/context.js
          node --check ui/memory.js
          node --check ui/near-setup.js
          node --check ui/near.js
      - name: Full app tests, including bundled adapters
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Build standalone fictional preview
        run: PYTHONPATH=. python scripts/build_workspace_preview.py artifacts/browser/Airlock-Preview.html
      - name: Guided test screen in a real browser
        run: node tests/safe_ui.cjs "$(command -v python)" "$(command -v google-chrome)" artifacts/browser
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: workspace-preview
          path: |
            artifacts/browser/Airlock-Preview.html
            artifacts/browser/workspace-*.png
          retention-days: 14
  build-mac:
    name: Build universal Mac download
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build once for both architectures
        run: python macos/package.py artifacts/Airlock_Mac_Latest.zip
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-mac
          path: artifacts/Airlock_Mac_Latest.zip
          retention-days: 14
  mac:
    name: Verify download on ${{ matrix.runner }}
    needs: build-mac
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - uses: actions/download-artifact@v4
        with:
          name: airlock-mac
          path: artifacts
      - name: Unpack and verify the delivered app
        run: |
          ditto -x -k artifacts/Airlock_Mac_Latest.zip artifacts/unpacked
          codesign --verify --deep --strict artifacts/unpacked/Airlock/Airlock.app
      - name: Verify macOS action sandbox
        run: |
          python scripts/diagnose_mac_sandbox.py
          python -m pytest -q tests/test_workbench.py
      - name: Compile the Mail and Calendar automation script
        run: osacompile -l JavaScript -o "$RUNNER_TEMP/airlock-device.scpt" privacy_layer/device_apps.js
      - name: Fresh app launch, native window, isolation, scoped access and revocation
        run: |
          xcrun clang -fobjc-arc -framework Cocoa -framework WebKit scripts/smoke_workspace_window.m -o "$RUNNER_TEMP/workspace-window-check"
          python scripts/smoke_mac.py artifacts/unpacked/Airlock/Airlock.app --window-probe "$RUNNER_TEMP/workspace-window-check"
  site:
    needs: [check, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: airlock-mac
          path: artifacts/
      - name: Build public website and source download
        run: python scripts/build_site.py --mac-archive artifacts/Airlock_Mac_Latest.zip
      - name: Verify links, archive scope and checksum
        run: python scripts/check_site.py
      - name: Sign release metadata with this GitHub workflow identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install --only-binary :all: -r requirements.lock
          python -m sigstore sign --bundle dist/updates.sigstore.json dist/updates.json
          python scripts/verify_update.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-website
          path: dist/
          retention-days: 14
      - name: Package website for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: [site, update-smoke, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
  update-smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - uses: actions/download-artifact@v4
        with:
          name: airlock-website
          path: published/
      - name: Verify signed release and reject tampering
        run: python scripts/verify_update.py published
      - name: Real app update, restart and failed-start recovery
        run: python scripts/smoke_update.py published
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [site, update-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: airlock-website
          path: published/
      - name: Keep a numbered release without overwriting older versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py published
