name: Validate and publish Airlock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airlock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Standalone app tests (companion app not included)
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests
          --ignore=tests/test_context.py
          --ignore=tests/test_portable.py
          --ignore=tests/test_sources_status.py
          -k 'not structural_mime_selection and not text_attachment_without'
      - name: Build public website and source download
        run: python scripts/build_site.py
      - name: Verify links, archive scope and checksum
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-website
          path: dist/
          retention-days: 14
      - name: Package website for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
