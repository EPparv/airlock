name: Validate and publish Airlock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airlock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Check updated browser scripts
        run: |
          node --check ui/context.js
          node --check ui/memory.js
      - name: Full app tests, including bundled adapters
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Verify macOS action sandbox
        id: sandbox
        continue-on-error: true
        run: |
          python scripts/diagnose_mac_sandbox.py
          python -m pytest -q tests/test_workbench.py
      - name: Build universal Mac app from this revision
        run: python macos/package.py artifacts/Airlock_Mac_Latest.zip --app-destination artifacts/Airlock.app
      - name: Fresh install, import, connect, retrieve and revoke
        run: python scripts/smoke_mac.py artifacts/Airlock.app
      - name: Require action sandbox checks
        if: steps.sandbox.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-15'
        with:
          name: airlock-mac
          path: artifacts/Airlock_Mac_Latest.zip
          retention-days: 14
  site:
    needs: [check, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: airlock-mac
          path: artifacts/
      - name: Build public website and source download
        run: python scripts/build_site.py --mac-archive artifacts/Airlock_Mac_Latest.zip
      - name: Verify links, archive scope and checksum
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-website
          path: dist/
          retention-days: 14
      - name: Package website for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
