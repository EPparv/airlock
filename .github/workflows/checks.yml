name: Validate and publish Airlock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airlock-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      website_only: ${{ steps.scope.outputs.website_only }}
      release_tag: ${{ steps.scope.outputs.release_tag }}
      release_commit: ${{ steps.scope.outputs.release_commit }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether the app matches its numbered release
        if: github.event_name == 'push'
        id: scope
        run: |
          tag="v$(python3 -c 'from privacy_layer.version import VERSION; print(VERSION)')"
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null &&
             git diff --quiet "refs/tags/$tag" HEAD -- . ':(exclude)web/**' ':(exclude).github/workflows/checks.yml'; then
            echo "website_only=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release_commit=$(git rev-parse "refs/tags/$tag^{commit}")" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: scope
    if: needs.scope.outputs.website_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Install pinned NEAR SDK for encryption and setup checks
        run: python -m pip install -r requirements-near.txt
      - name: Check updated browser scripts
        run: |
          node --check ui/safe-test.js
          node --check ui/ui.js
          node --check ui/onboarding.js
          node --check ui/context.js
          node --check ui/memory.js
          node --check ui/near-setup.js
          node --check ui/near.js
      - name: Full app tests, including bundled adapters
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Guided test screen in a real browser
        run: node tests/safe_ui.cjs "$(command -v python)" "$(command -v google-chrome)"
  mac:
    needs: scope
    if: needs.scope.outputs.website_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Verify macOS action sandbox
        id: sandbox
        continue-on-error: true
        run: |
          python scripts/diagnose_mac_sandbox.py
          python -m pytest -q tests/test_workbench.py
      - name: Build universal Mac app from this revision
        run: python macos/package.py artifacts/Airlock_Mac_Latest.zip --app-destination artifacts/Airlock.app
      - name: Fresh install, isolation, scoped access and revocation
        run: python scripts/smoke_mac.py artifacts/Airlock.app
      - name: Require action sandbox checks
        if: steps.sandbox.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-15'
        with:
          name: airlock-mac
          path: artifacts/Airlock_Mac_Latest.zip
          retention-days: 14
  site:
    needs: [check, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: airlock-mac
          path: artifacts/
      - name: Build public website and source download
        run: python scripts/build_site.py --mac-archive artifacts/Airlock_Mac_Latest.zip
      - name: Verify links, archive scope and checksum
        run: python scripts/check_site.py
      - name: Sign release metadata with this GitHub workflow identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install --only-binary :all: -r requirements.lock
          python -m sigstore sign --bundle dist/updates.sigstore.json dist/updates.json
          python scripts/verify_update.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-website
          path: dist/
          retention-days: 14
      - name: Package website for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  landing:
    needs: scope
    if: needs.scope.outputs.website_only == 'true' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage the web files with the exact published downloads and updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.scope.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.scope.outputs.release_commit }}
        run: |
          mkdir dist
          cp web/* dist/
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern Airlock_Mac_Latest.zip --pattern Airlock_Source_Latest.zip \
            --pattern release.json --pattern SHA256SUMS \
            --pattern updates.json --pattern updates.sigstore.json
          cd dist
          sha256sum --check --strict SHA256SUMS
          jq -es --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            'length == 2 and all(.[]; ("v" + .version == $tag) and (.commit == $commit))' release.json updates.json
          version=$(jq -r .version release.json)
          sed -i "s/{{VERSION}}/$version/g; s/{{REVISION}}/${RELEASE_COMMIT:0:8}/g; s/{{MAC_DOWNLOAD}}/Airlock_Mac_Latest.zip/g" index.html
          if grep -F '{{' index.html; then exit 1; fi
      - name: Verify the existing signature and Mac download
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock
          python scripts/verify_update.py dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.PUBLISH_PAGES == 'true' && (needs.landing.result == 'success' || needs.release.result == 'success') }}
    needs: [site, update-smoke, release, landing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
  update-smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - uses: actions/download-artifact@v4
        with:
          name: airlock-website
          path: published/
      - name: Verify signed release and reject tampering
        run: python scripts/verify_update.py published
      - name: Real app update, restart and failed-start recovery
        run: python scripts/smoke_update.py published
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [site, update-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: airlock-website
          path: published/
      - name: Keep a numbered release without overwriting older versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py published
