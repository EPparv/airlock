name: Verify installed Codex and Cursor
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: airlock-vendor-desktop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  requested:
    name: Check owner request
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.intent.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: intent
        run: |
          if git log -1 --format=%s | grep -Fq '[verify desktop apps]'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

  vendor:
    needs: requested
    if: needs.requested.outputs.enabled == 'true'
    name: Signed ${{ matrix.bundle }} on a fresh Mac
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Intel release digests from the Homebrew chatgpt and cursor casks.
      matrix:
        include:
          - agent: codex
            bundle: ChatGPT.app
            identifier: com.openai.codex
            url: https://persistent.oaistatic.com/codex-app-prod/ChatGPT-darwin-x64-26.1120.50957.zip
            sha256: 22ea841290d2767dd133f0f45fdd950bb5582c06f5df2c8796e17c967b6db8b0
          - agent: cursor
            bundle: Cursor.app
            identifier: com.todesktop.230313mzl4w4u92
            url: https://downloads.cursor.com/production/0925c4b8226c56947c43f0b555fb98e187a7e029/darwin/x64/Cursor-darwin-x64.zip
            sha256: 74ed9166ac008bce19cb5feb5e7eda8db4df9374f0e21d0f4d7ce9c9c423f104
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Install and verify pinned vendor release
        env:
          ARCHIVE_URL: ${{ matrix.url }}
          ARCHIVE_SHA256: ${{ matrix.sha256 }}
          BUNDLE: ${{ matrix.bundle }}
          IDENTIFIER: ${{ matrix.identifier }}
        run: |
          set -eu
          bundle_path="$HOME/Applications/$BUNDLE"
          test ! -e "$bundle_path"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --max-time 450 --output vendor.zip "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  vendor.zip" | shasum -a 256 -c -
          mkdir -p unpacked "$HOME/Applications"
          ditto -x -k vendor.zip unpacked
          mv "unpacked/$BUNDLE" "$bundle_path"
          codesign --verify --deep --strict "$bundle_path"
          codesign --verify -R="identifier \"$IDENTIFIER\" and anchor apple generic" "$bundle_path"
          spctl --assess --type execute --verbose=2 "$bundle_path"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$bundle_path"
          echo "AIRLOCK_VENDOR_BUNDLE=$bundle_path" >> "$GITHUB_ENV"
      - name: Open through Airlock and reopen the same process
        env:
          AIRLOCK_VENDOR_AGENT: ${{ matrix.agent }}
        run: |
          set -eu
          export AIRLOCK_VENDOR_PROBE="$RUNNER_TEMP/airlock-vendor-probe"
          xcrun clang -fobjc-arc -framework Cocoa -framework WebKit -framework CoreImage scripts/check_vendor_desktop.m -o "$AIRLOCK_VENDOR_PROBE"
          python -m pytest -q -s tests/test_vendor_desktop.py::test_vendor_mac_launch_and_mcp_discovery
      - name: Verify the packaged Codex daemon can read and revoke scoped memory without inference
        if: matrix.agent == 'codex'
        run: |
          set -eu
          AIRLOCK_TEST_CODEX="$(python - <<'PY'
          import os
          from pathlib import Path
          from privacy_layer.clients import codex_bundle_binary
          bundle = Path(os.environ['AIRLOCK_VENDOR_BUNDLE'])
          binary = codex_bundle_binary(bundle)
          if binary is None:
              raise SystemExit('Airlock could not locate the CLI inside the signed ChatGPT app.')
          print(binary)
          PY
          )"
          export AIRLOCK_TEST_CODEX
          echo "Airlock found ${AIRLOCK_TEST_CODEX#"$AIRLOCK_VENDOR_BUNDLE"/} inside the signed app."
          "$AIRLOCK_TEST_CODEX" --version
          python -m pytest -v -s tests/test_mcp.py::test_installed_codex_daemon_reloads_scoped_connection
